[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-bridge"
version = "0.4.0"
description = "Internal management core for the PatchPort VS Code extension"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/utialy/PatchPort"
Issues = "https://github.com/utialy/PatchPort/issues"

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
